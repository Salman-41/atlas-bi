[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-bi"
version = "0.1.0"
description = "Retail event intelligence with auditable analytics and temporal machine learning"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic-settings>=2,<3", "sqlalchemy>=2,<3", "psycopg[binary]>=3,<4", "alembic>=1,<2", "redis>=5,<9", "celery>=5,<6", "duckdb>=1.3.2,<1.4", "pyarrow>=18,<26", "pandas>=2.2,<4", "numpy>=2,<3", "scikit-learn>=1.5,<2", "joblib>=1.4,<2", "pyjwt>=2.9,<3", "argon2-cffi>=23", "reportlab>=4,<6"]

[project.optional-dependencies]
mlops = ["mlflow>=3,<4"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "psutil>=6,<8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
